name: פריסה ל-Cloudflare

# רץ אחרי מיזוג ל-main, או ידנית מלשונית Actions.
# סודות נדרשים ב-GitHub (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ADMIN_EMAILS, RATE_SALT
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: בדיקה שהסודות הוגדרו
        run: |
          missing=""
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do [ -z "${!s}" ] && missing="$missing $s"; done
          if [ -n "$missing" ]; then echo "::error::חסרים סודות ב-GitHub:$missing (ראו docs/DEPLOY.md)"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: בדיקות לפני פריסה
        run: npm test
      - name: מסד נתונים D1 (יצירה בפעם הראשונה בלבד)
        run: |
          ID=$(npx wrangler d1 list --json | node -e "const l=JSON.parse(require('fs').readFileSync(0,'utf8'));const d=l.find(x=>x.name==='miflaga-db');process.stdout.write(d?(d.uuid||d.database_id||''):'')")
          if [ -z "$ID" ]; then
            npx wrangler d1 create miflaga-db
            ID=$(npx wrangler d1 list --json | node -e "const l=JSON.parse(require('fs').readFileSync(0,'utf8'));const d=l.find(x=>x.name==='miflaga-db');process.stdout.write(d.uuid||d.database_id)")
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.toml
          echo "D1: $ID"
      - name: עדכון סכמת המסד
        run: npx wrangler d1 migrations apply miflaga-db --remote
      - name: פריסה
        run: npx wrangler deploy
      - name: סודות השרת
        env:
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          RATE_SALT: ${{ secrets.RATE_SALT }}
        run: |
          if [ -n "$ADMIN_EMAILS" ]; then printf '%s' "$ADMIN_EMAILS" | npx wrangler secret put ADMIN_EMAILS; else echo "::warning::ADMIN_EMAILS לא הוגדר: אף אחד לא יוכל לנהל"; fi
          if [ -n "$RATE_SALT" ]; then printf '%s' "$RATE_SALT" | npx wrangler secret put RATE_SALT; else echo "::warning::RATE_SALT לא הוגדר"; fi
      - name: בדיקת תקינות אחרי פריסה
        run: |
          sleep 5
          curl -fsS https://miflaga.reembir.com/api/health || echo "::warning::הכתובת miflaga.reembir.com עוד לא מגיבה (ייתכן ש-DNS מתעדכן)"
